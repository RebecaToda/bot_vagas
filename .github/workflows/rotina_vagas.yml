name: Monitor de Vagas Tech

on:
  schedule:
    # Roda automaticamente todos os dias às 08:00 e às 18:00 (Horário UTC)
    - cron: '0 8,18 * * *'
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente quando quiser

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install google-genai requests python-dotenv python-jobspy pydantic

    - name: Executar o Robô de Vagas
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
